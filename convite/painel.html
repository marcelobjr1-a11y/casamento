<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Karina &amp; Marcelo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;550;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FAF8F4; --surface:#fff; --line:#E8E2D7; --ink:#17150F; --ink-3:#6B655A; --muted:#938C7F;
    --gold:#A8874E; --gold-wash:#F6F0E4; --ok:#6E8B6A; --ok-wash:#EDF2EB; --danger:#B0574B; --danger-wash:#FAEDEA; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:Inter,sans-serif; font-size:14px; }
  h1{ font-family:"Cormorant Garamond",serif; font-weight:500; }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  .login{ max-width:360px; margin:80px auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px; text-align:center; }
  .login input{ width:100%; height:44px; border-radius:10px; border:1px solid var(--line); padding:0 14px; font-size:14px; margin-top:16px; }
  .login button{ width:100%; height:44px; border-radius:10px; border:0; background:var(--ink); color:#fff; font-weight:600; margin-top:14px; cursor:pointer; }
  .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tabs button{ height:36px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:13px; cursor:pointer; }
  .tabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .stats{ display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:120px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat b{ display:block; font-size:24px; font-family:"Cormorant Garamond",serif; }
  .stat span{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td{ padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:13px; }
  th{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  tr:last-child td{ border-bottom:0; }
  .badge{ display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:600; }
  .badge.ok{ background:var(--ok-wash); color:#4F6A4C; }
  .badge.no{ background:var(--danger-wash); color:#93463B; }
  .badge.done{ background:var(--gold-wash); color:#8A6E39; }
  button.mini{ height:28px; padding:0 10px; border-radius:7px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; cursor:pointer; }
  button.mini:hover{ background:var(--gold-wash); }
  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .form-item{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .form-item .grow{ flex:1; min-width:200px; }
  .form-item input,.form-item textarea{ width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; margin-top:6px; font-family:inherit; }
  .form-item textarea{ resize:vertical; min-height:44px; }
  .newitem{ background:var(--gold-wash); border:1px dashed #D9C89E; }
  .msg{ font-size:12px; color:var(--muted); margin-top:4px; }
  .top button.logout{ height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; cursor:pointer; }
</style>
</head>
<body>

<div class="login" id="tela-login">
  <h1 style="font-size:26px">Painel do casal</h1>
  <p style="color:var(--ink-3);font-size:13px;margin-top:8px">Digite a senha definida no supabase-setup.sql</p>
  <input type="password" id="senha" placeholder="Senha">
  <button id="btn-entrar">Entrar</button>
  <div class="msg" id="login-msg"></div>
</div>

<div class="wrap" id="tela-painel" style="display:none">
  <div class="top">
    <h1 style="font-size:28px;margin:0">Painel — Karina &amp; Marcelo</h1>
    <button class="logout" id="btn-sair">Sair</button>
  </div>

  <div class="tabs">
    <button class="active" data-tab="rsvp">Respostas de RSVP</button>
    <button data-tab="presentes">Lista de presentes</button>
  </div>

  <div id="painel-rsvp">
    <div class="stats" id="rsvp-stats"></div>
    <div id="rsvp-tabela"></div>
  </div>

  <div id="painel-presentes" style="display:none">
    <div id="presentes-lista"></div>
    <div class="form-item newitem">
      <div class="grow">
        <label style="font-size:12px;font-weight:600">Nome do novo item</label>
        <input id="np-nome" placeholder="Ex.: Jogo de taças">
      </div>
      <div class="grow">
        <label style="font-size:12px;font-weight:600">Descrição (opcional)</label>
        <input id="np-desc" placeholder="Ex.: Um conjunto para as ocasiões especiais">
      </div>
      <button class="mini" id="np-add" style="align-self:flex-end;height:36px">+ Adicionar item</button>
    </div>
  </div>
</div>

<script src="dados.js"></script>
<script>
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtData(s){ const d=new Date(s); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }

let SENHA = sessionStorage.getItem("painel_senha") || "";

async function chamarRPC(nome, corpo){
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify(corpo||{})
  });
  const texto = await resp.text();
  let dados; try{ dados = texto?JSON.parse(texto):null; }catch(_){ dados = texto; }
  if(!resp.ok){
    const msg = (dados && (dados.message||dados.error_description)) || "Erro ao carregar.";
    throw new Error(msg);
  }
  return dados;
}

async function entrar(senha){
  if(!SUPABASE_URL || !SUPABASE_KEY){
    $("#login-msg").textContent = "Configure SUPABASE_URL e SUPABASE_KEY no arquivo dados.js primeiro.";
    return;
  }
  try{
    await chamarRPC("listar_respostas_site", { p_senha: senha });
    SENHA = senha;
    sessionStorage.setItem("painel_senha", senha);
    $("#tela-login").style.display = "none";
    $("#tela-painel").style.display = "";
    carregarRSVP();
    carregarPresentes();
  }catch(err){
    $("#login-msg").textContent = "Senha incorreta.";
  }
}

$("#btn-entrar").addEventListener("click", () => entrar($("#senha").value));
$("#senha").addEventListener("keydown", e => { if(e.key==="Enter") entrar($("#senha").value); });
$("#btn-sair").addEventListener("click", () => { sessionStorage.removeItem("painel_senha"); location.reload(); });

$$(".tabs button").forEach(b => b.addEventListener("click", () => {
  $$(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $("#painel-rsvp").style.display = b.dataset.tab==="rsvp" ? "" : "none";
  $("#painel-presentes").style.display = b.dataset.tab==="presentes" ? "" : "none";
}));

async function carregarRSVP(){
  const cx = $("#rsvp-tabela");
  try{
    const linhas = await chamarRPC("listar_respostas_site", { p_senha: SENHA });
    const conf = linhas.filter(l=>l.status==="confirmado");
    const rec = linhas.filter(l=>l.status==="recusado");
    const pessoas = conf.reduce((a,l)=>a+(l.quantidade_pessoas||1),0);
    $("#rsvp-stats").innerHTML = `
      <div class="stat"><b>${linhas.length}</b><span>Respostas</span></div>
      <div class="stat"><b>${conf.length}</b><span>Confirmaram</span></div>
      <div class="stat"><b>${pessoas}</b><span>Pessoas confirmadas</span></div>
      <div class="stat"><b>${rec.length}</b><span>Não vão</span></div>`;

    if(!linhas.length){ cx.innerHTML = `<div class="empty">Nenhuma resposta ainda. Assim que alguém confirmar pelo site, aparece aqui.</div>`; return; }

    cx.innerHTML = `<table><thead><tr>
      <th>Nome</th><th>Contato</th><th>Pessoas</th><th>Restrição</th><th>Status</th><th>Quando</th><th></th>
      </tr></thead><tbody>
      ${linhas.map(l => `<tr>
        <td>${esc(l.nome)}${l.mensagem?`<div style="font-size:11.5px;color:var(--ink-3);margin-top:3px;max-width:220px">"${esc(l.mensagem)}"</div>`:""}</td>
        <td>${esc(l.telefone||"")}${l.email?`<br>${esc(l.email)}`:""}</td>
        <td>${l.quantidade_pessoas||1}${l.criancas?` (${l.criancas} criança${l.criancas>1?"s":""})`:""}</td>
        <td>${esc(l.restricao||"—")}</td>
        <td>${l.status==="confirmado"?'<span class="badge ok">Confirmado</span>':'<span class="badge no">Não vai</span>'}</td>
        <td>${fmtData(l.criado_em)}</td>
        <td>${l.importado?'<span class="badge done">Importado</span>':`<button class="mini" data-import="${l.id}">Marcar importado</button>`}</td>
      </tr>`).join("")}
      </tbody></table>`;

    cx.querySelectorAll("[data-import]").forEach(b => b.addEventListener("click", async () => {
      await chamarRPC("marcar_respostas_importadas", { p_senha: SENHA, p_ids: [b.dataset.import] });
      carregarRSVP();
    }));
  }catch(err){
    cx.innerHTML = `<div class="empty">Não foi possível carregar: ${esc(err.message)}</div>`;
  }
}

async function carregarPresentes(){
  const cx = $("#presentes-lista");
  try{
    const itens = await chamarRPC("admin_listar_presentes", { p_senha: SENHA });
    if(!itens.length){ cx.innerHTML = `<div class="empty">Nenhum item cadastrado ainda.</div>`; return; }
    cx.innerHTML = itens.map(it => `
      <div class="form-item" data-id="${it.id}">
        <div class="grow">
          <label style="font-size:12px;font-weight:600">Nome</label>
          <input class="ip-nome" value="${esc(it.nome)}">
        </div>
        <div class="grow">
          <label style="font-size:12px;font-weight:600">Descrição</label>
          <input class="ip-desc" value="${esc(it.descricao||"")}">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-self:flex-end">
          ${it.reservado ? `<span class="badge done">Reservado por ${esc(it.reservado_por||"—")}</span><button class="mini" data-liberar="${it.id}">Liberar de novo</button>`
                          : `<span class="badge ok">Disponível</span>`}
        </div>
        <div style="display:flex;gap:6px;align-self:flex-end">
          <button class="mini" data-salvar="${it.id}">Salvar</button>
          <button class="mini" data-excluir="${it.id}" style="color:#93463B">Excluir</button>
        </div>
      </div>`).join("");

    cx.querySelectorAll("[data-salvar]").forEach(b => b.addEventListener("click", async () => {
      const card = b.closest(".form-item");
      await chamarRPC("admin_salvar_presente", {
        p_senha: SENHA, p_id: b.dataset.salvar,
        p_nome: card.querySelector(".ip-nome").value.trim(),
        p_descricao: card.querySelector(".ip-desc").value.trim(),
        p_ordem: 0
      });
      carregarPresentes();
    }));
    cx.querySelectorAll("[data-excluir]").forEach(b => b.addEventListener("click", async () => {
      if(!confirm("Excluir este item da lista de presentes?")) return;
      await chamarRPC("admin_excluir_presente", { p_senha: SENHA, p_id: b.dataset.excluir });
      carregarPresentes();
    }));
    cx.querySelectorAll("[data-liberar]").forEach(b => b.addEventListener("click", async () => {
      await chamarRPC("admin_liberar_presente", { p_senha: SENHA, p_id: b.dataset.liberar });
      carregarPresentes();
    }));
  }catch(err){
    cx.innerHTML = `<div class="empty">Não foi possível carregar: ${esc(err.message)}</div>`;
  }
}

$("#np-add").addEventListener("click", async () => {
  const nome = $("#np-nome").value.trim();
  if(nome.length < 2){ return; }
  await chamarRPC("admin_salvar_presente", { p_senha: SENHA, p_id: null, p_nome: nome, p_descricao: $("#np-desc").value.trim(), p_ordem: 99 });
  $("#np-nome").value = ""; $("#np-desc").value = "";
  carregarPresentes();
});

if(SENHA) entrar(SENHA);
</script>
</body>
</html>
